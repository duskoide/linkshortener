{{define "title"}}Create Link - Link Shortener{{end}}

{{define "content"}}
<div class="card">
    <h2>Create New Link</h2>

    {{if .Error}}
    <div class="error">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/create">
        <input type="url" name="url" placeholder="https://example.com/your-very-long-url-here" required>
        <input type="text" name="custom_code" id="custom_code" placeholder="Custom short code (e.g. mylink)" oninput="document.getElementById('preview').textContent = this.value || '{code}'">
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">Short link will be: <strong>s.duskoide.org/<em id="preview">{code}</em></strong></p>
        <button type="submit" class="btn">Create Link</button>
    </form>
</div>
{{end}}
